# Non-secret configuration. Environment variables override these values.
allowed_user_id = 123456789
codex_bin = "/absolute/path/to/codex"
codex_home = "/Users/me/.codex"
data_dir = "/Users/me/Library/Application Support/codex-telegram-remote"
project_roots = ["/Users/me/project-a"]
project_parent_dirs = ["/Users/me/IdeaProjects"]
project_discovery_depth = 1
max_concurrent_turns = 3
log_level = "info"
# Optional Mini App: choose a stable HTTPS origin OR a temporary tunnel binary.
# mini_app_url = "https://your-domain.example"
# mini_app_tunnel_bin = "/opt/homebrew/bin/cloudflared"
# mini_app_port = 8787

[project_aliases]
project-a = "/Users/me/project-a"
